<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew_Hansford_CV</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,ital,wght@9..40,0,300;9..40,0,400;9..40,0,500;9..40,1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #1F4E79;
    --navy-light: #d0e4f7;
    --text: #1a1a1a;
    --muted: #5a5a5a;
    --border: #c8c8c8;
    --bg: #ffffff;
    --ui-bg: #f4f6f9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--ui-bg);
    color: var(--text);
    min-height: 100vh;
  }

  .selector-bar {
    background: var(--navy);
    padding: 12px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .selector-bar span {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .cv-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    padding: 5px 14px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .cv-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .cv-btn.active { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.7); }

  .print-btn, .login-link {
    margin-left: auto;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--navy);
    background: #fff;
    border: none;
    border-radius: 4px;
    padding: 5px 16px;
    cursor: pointer;
    transition: opacity 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .print-btn:hover, .login-link:hover { opacity: 0.85; }

  .cv-page {
    max-width: 900px;
    margin: 32px auto;
    background: var(--bg);
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    padding: 0;
    overflow: hidden;
    background: linear-gradient(to right, var(--navy) 0, var(--navy) 315px, #fff 315px, #fff 100%);
  }

  .design-layout { display: flex; align-items: stretch; }
  .design-sidebar {
    width: 315px;
    flex-shrink: 0;
    background: transparent;
    color: #fff;
    padding: 44px 28px;
  }
  .design-sidebar .d-name { font-size: 24px; font-weight: 300; margin-bottom: 4px; }
  .design-sidebar .d-tagline { font-size: 11px; font-weight: 300; color: #cfe0f2; line-height: 1.5; margin-bottom: 28px; }
  .design-sidebar .d-heading {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    color: #9fc0e0; border-bottom: 1px solid rgba(255,255,255,0.25);
    padding-bottom: 5px; margin: 22px 0 8px;
  }
  .design-sidebar .d-heading:first-of-type { margin-top: 0; }
  .design-sidebar .d-list { font-size: 11px; font-weight: 300; line-height: 1.85; color: #eaf1f9; }
  .design-sidebar .d-list a { color: #eaf1f9; text-decoration: none; }
  .design-sidebar .d-list a:hover { text-decoration: underline; }
  .design-sidebar .d-list-2col { display: grid; grid-template-columns: 1fr 1fr; column-gap: 10px; }

  .design-main { flex-grow: 1; padding: 44px 40px; min-width: 0; }
  .design-main .section-heading:first-child { margin-top: 0; }

  .section-heading {
    font-size: 11px;
    font-weight: 400;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    border-bottom: 0.5px solid var(--navy);
    padding-bottom: 5px;
    margin: 22px 0 12px;
  }

  .body-text { font-size: 12px; font-weight: 300; line-height: 1.65; color: var(--text); margin-bottom: 8px; }

  .role-block { margin-bottom: 14px; }
  .role-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .role-meta { font-size: 12px; font-weight: 300; color: var(--muted); margin-bottom: 6px; }
  .role-summary { font-size: 11.5px; font-weight: 300; color: var(--muted); line-height: 1.5; margin: 2px 0 5px; }

  ul.cv-list { padding-left: 16px; margin-bottom: 6px; }
  ul.cv-list li { font-size: 12px; font-weight: 300; line-height: 1.65; color: var(--text); margin-bottom: 3px; }

  .loading-msg { color: #fff; padding: 60px; font-size: 13px; }

  .zio-toggle { display: flex; align-items: center; gap: 4px; }
  .zio-toggle-label { font-size: 10px; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; }
  .zio-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: var(--muted);
    background: #fff;
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .zio-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  @page { margin: 0; }
  @media print {
    .selector-bar { display: none; }
    .zio-toggle { display: none; }
    body { background: white; }
    .cv-page { margin: 0; box-shadow: none; padding: 0; max-width: 100%; }
    .cv-page, .design-sidebar { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .role-title, .role-meta, .role-summary { break-after: avoid; page-break-after: avoid; }
    ul.cv-list li { break-inside: avoid; page-break-inside: avoid; }
    .section-heading { break-after: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>

<div class="selector-bar">
  <span>CV View</span>
  <div id="lens-buttons"></div>
  <button class="print-btn" onclick="window.print()" title="Export as PDF" aria-label="Export as PDF" style="padding:5px 10px;display:inline-flex;align-items:center;justify-content:center;">⬇</button>
  <a class="login-link" href="admin.html" style="margin-left:8px;">Login</a>
</div>

<div class="cv-page">
  <div class="design-layout" id="cv-root">
    <div class="loading-msg">Loading CV…</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vbtgxnrnuvxhwyktjviz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZidGd4bnJudXZ4aHd5a3Rqdml6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjI4NDcsImV4cCI6MjEwNjE5ODg0N30.-w5Zo5uFr0ke64lojjIS2xrvga46ggwiDiRCQNZKqdI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function linkHrefFor(kind, value){
  value = (value||"").trim();
  if (!value) return "#";
  if (kind === "email") return "mailto:" + value;
  if (kind === "phone") return "tel:" + value.replace(/\s+/g,"");
  if (/^https?:\/\//i.test(value)) return value;
  return "https://" + value;
}
function displayFor(kind, value){
  value = (value||"").trim();
  if (!value) return "";
  if (kind === "website" || kind === "linkedin") return value.replace(/^https?:\/\//i,"").replace(/\/$/,"");
  return value;
}

function monthYear(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-NZ", { month: "short", year: "numeric" });
}
function yearOnly(dateStr){
  if (!dateStr) return null;
  return new Date(dateStr + "T00:00:00").getFullYear();
}

let LENSES = [];
let currentLensKey = null;
let PROFILE = null;
let WORK_ROLES = [];
let BULLETS_BY_ROLE = {};
let roleModeByRoleId = {}; // session-only: roleId -> full | partial | none (default full)

function renderLensButtons(){
  const wrap = document.getElementById("lens-buttons");
  wrap.innerHTML = "";
  LENSES.forEach(lens=>{
    const btn = document.createElement("button");
    btn.className = "cv-btn" + (lens.key === currentLensKey ? " active" : "");
    btn.textContent = lens.label;
    btn.onclick = ()=> setLens(lens.key);
    wrap.appendChild(btn);
  });
}

function setRoleMode(roleId, mode){
  roleModeByRoleId[roleId] = mode;
  renderRoleBlocks();
}

function roleToggleHtml(roleId){
  const mode = roleModeByRoleId[roleId] || "full";
  const opts = [["full","Full"],["partial","Partial"],["none","None"]];
  return '<div class="zio-toggle">' +
    opts.map(function(o){
      return '<button type="button" class="zio-btn' + (mode===o[0]?" active":"") + '" onclick="setRoleMode(\'' + roleId + '\',\'' + o[0] + '\')">' + o[1] + '</button>';
    }).join("") +
    '</div>';
}

function renderRoleBlock(r){
  const start = monthYear(r.start_date);
  const end = r.end_date ? monthYear(r.end_date) : "Present";
  const dateRange = start ? (start + " \u2013 " + end) : "";
  const metaParts = [r.org, dateRange, r.location].filter(Boolean);
  let roleBullets = (BULLETS_BY_ROLE[r.id]||[]).filter(function(b){return !b.hidden;}).sort(function(a,b){return a.sort_order-b.sort_order;});
  const mode = roleModeByRoleId[r.id] || "full";

  if (mode === "none") return "";
  if (mode === "partial") roleBullets = roleBullets.slice(0,3);

  return '<div class="role-block">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">' +
      '<p class="role-title" style="margin-bottom:0">' + escapeHtml(r.title) + '</p>' +
      roleToggleHtml(r.id) +
    '</div>' +
    '<p class="role-meta">' + metaParts.map(escapeHtml).join(" | ") + '</p>' +
    (r.summary ? '<p class="role-summary">' + escapeHtml(r.summary) + '</p>' : "") +
    (roleBullets.length ? '<ul class="cv-list">' + roleBullets.map(function(b){ return '<li>' + escapeHtml(b.bullet_text) + '</li>'; }).join("") + '</ul>' : "") +
    '</div>';
}

function renderRoleBlocks(){
  const el = document.getElementById("role-blocks");
  if (!el) return;
  el.innerHTML = WORK_ROLES.map(renderRoleBlock).join("");
}

function setLens(key){
  currentLensKey = key;
  renderLensButtons();
  const lens = LENSES.find(l=>l.key===key);
  const taglineEl = document.getElementById("cv-tagline");
  if (taglineEl && lens) taglineEl.textContent = lens.tagline;
  const leadershipEl = document.getElementById("leadership-style-block");
  if (leadershipEl){
    leadershipEl.style.display = (key === "executive") ? "block" : "none";
  }
  renderRoleBlocks();
}

async function loadCV(){
  const [
    { data: profile, error: pErr },
    { data: lenses, error: lErr },
    { data: hobbies },
    { data: capabilities },
    { data: tools },
    { data: types },
    { data: roles },
    { data: bullets }
  ] = await Promise.all([
    sb.from("cv_profile").select("*").eq("id",1).single(),
    sb.from("cv_lenses").select("*").order("sort_order"),
    sb.from("cv_hobbies").select("*").order("sort_order"),
    sb.from("cv_capabilities").select("*").order("sort_order"),
    sb.from("cv_tools").select("*").order("sort_order"),
    sb.from("cv_types").select("*").order("sort_order"),
    sb.from("cv_roles").select("*").order("sort_order"),
    sb.from("cv_bullets").select("*").order("sort_order"),
  ]);

  if (pErr || lErr){
    document.getElementById("cv-root").innerHTML = '<div class="loading-msg">Couldn\'t load CV data. Please refresh.</div>';
    return;
  }

  PROFILE = profile;
  LENSES = lenses || [];
  currentLensKey = LENSES[0] ? LENSES[0].key : null;

  const typeByName = {};
  (types||[]).forEach(t => typeByName[t.name] = t);
  const rolesByType = {};
  (roles||[]).forEach(r => {
    rolesByType[r.type_id] = rolesByType[r.type_id] || [];
    rolesByType[r.type_id].push(r);
  });
  const bulletsByRole = {};
  (bullets||[]).forEach(b => {
    bulletsByRole[b.role_id] = bulletsByRole[b.role_id] || [];
    bulletsByRole[b.role_id].push(b);
  });

  const workRoles = typeByName["Work"] ? (rolesByType[typeByName["Work"].id]||[]) : [];
  const eduRoles = typeByName["Education"] ? (rolesByType[typeByName["Education"].id]||[]) : [];
  const certRoles = typeByName["Certificate"] ? (rolesByType[typeByName["Certificate"].id]||[]) : [];
  const awardRoles = typeByName["Award"] ? (rolesByType[typeByName["Award"].id]||[]) : [];
  WORK_ROLES = workRoles;
  BULLETS_BY_ROLE = bulletsByRole;

  const contactLines = [];
  if (profile.location) contactLines.push(escapeHtml(profile.location));
  if (profile.phone) contactLines.push('<a href="' + linkHrefFor("phone", profile.phone) + '">' + escapeHtml(profile.phone) + '</a>');
  if (profile.email) contactLines.push('<a href="' + linkHrefFor("email", profile.email) + '">' + escapeHtml(profile.email) + '</a>');
  if (profile.website) contactLines.push('<a href="' + linkHrefFor("website", profile.website) + '" target="_blank">' + escapeHtml(displayFor("website", profile.website)) + '</a>');
  if (profile.linkedin) contactLines.push('<a href="' + linkHrefFor("linkedin", profile.linkedin) + '" target="_blank">' + escapeHtml(displayFor("linkedin", profile.linkedin)) + '</a>');

  const capabilitiesHtml = (capabilities||[]).map(c=>escapeHtml(c.item_text)).join("<br>");
  const toolsHtml = (tools && tools.length) ? ('<div class="d-list-2col">' + tools.map(t=>'<div>'+escapeHtml(t.item_text)+'</div>').join("") + '</div>') : "";
  const hobbiesHtml = (hobbies||[]).map(h=>escapeHtml(h.hobby_text)).join(" &middot; ");

  const eduGroups = [];
  eduRoles.forEach(r=>{
    const org = r.org || "";
    let group = eduGroups.find(g=>g.org===org);
    if (!group){ group = { org, titles: [] }; eduGroups.push(group); }
    group.titles.push(r.title);
  });
  const eduHtml = eduGroups.map(function(g){
    return '<div style="margin-top:8px;font-weight:500;color:#fff">' + escapeHtml(g.org) + '</div>' +
      g.titles.map(function(t){ return escapeHtml(t); }).join("<br>");
  }).join("").replace(/^<div style="margin-top:8px;/, '<div style="margin-top:0;');

  const certHtml = certRoles.map(r=>{
    return escapeHtml(r.title);
  }).join("<br>");

  const awardHtml = awardRoles.map(r=>{
    return escapeHtml(r.title) + (r.org ? ", " + escapeHtml(r.org) : "");
  }).join("<br>");

  const sidebarSections = [
    contactLines.length ? { heading: "Contact", html: contactLines.join("<br>") } : null,
    capabilitiesHtml ? { heading: "Capabilities", html: capabilitiesHtml } : null,
    toolsHtml ? { heading: "Tools", html: toolsHtml } : null,
    eduHtml ? { heading: "Education", html: eduHtml } : null,
    certHtml ? { heading: "Certifications", html: certHtml } : null,
    awardHtml ? { heading: "Awards", html: awardHtml } : null,
    hobbiesHtml ? { heading: "Interests", html: hobbiesHtml } : null,
  ].filter(Boolean);

  const sidebarHtml =
    '<div class="d-name">Andrew Hansford</div>' +
    '<div class="d-tagline" id="cv-tagline"></div>' +
    sidebarSections.map(function(s){
      return '<div class="d-heading">' + s.heading + '</div><div class="d-list">' + s.html + '</div>';
    }).join("");

  const mainHtml =
    '<div class="section-heading">Profile</div>' +
    '<p class="body-text">' + escapeHtml(profile.summary||"") + '</p>' +
    '<div id="leadership-style-block" style="display:none">' +
      '<div class="section-heading">Leadership Style</div>' +
      '<p class="body-text">' + escapeHtml(profile.leadership_style||"") + '</p>' +
    '</div>' +
    '<div class="section-heading">Professional Experience</div>' +
    '<div id="role-blocks"></div>';

  document.getElementById("cv-root").innerHTML =
    '<aside class="design-sidebar">' + sidebarHtml + '</aside>' +
    '<main class="design-main">' + mainHtml + '</main>';

  renderLensButtons();
  setLens(currentLensKey);
}

loadCV();
</script>

</body>
</html>
