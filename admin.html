<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV data admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F4E79;
    --navy-dark:#163a5c;
    --ink:#1c2530;
    --muted:#5b6b7c;
    --line:#dde3e9;
    --bg:#f5f7fa;
    --card:#ffffff;
    --danger:#b3352b;
    --danger-bg:#fbeceb;
    --ok:#1d7a4c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"DM Sans", system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header h1{
    font-size:18px;
    font-weight:600;
    margin:0;
    letter-spacing:.2px;
  }
  header .who{
    font-size:13px;
    color:#cfe0f0;
    display:flex;
    align-items:center;
    gap:14px;
  }
  header button{
    background:transparent;
    border:1px solid #4d76a0;
    color:#fff;
    padding:6px 12px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  header button:hover{background:var(--navy-dark)}

  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
  }
  .login-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:36px 34px;
    width:340px;
    box-shadow:0 1px 3px rgba(20,40,60,.06);
  }
  .login-card h1{
    font-size:20px;
    margin:0 0 4px;
    color:var(--navy);
  }
  .login-card p.sub{
    margin:0 0 22px;
    font-size:13px;
    color:var(--muted);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:5px;
  }
  input[type=email], input[type=password], input[type=text], input[type=date], textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:14px;
    margin-bottom:16px;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:44px;overflow:hidden}
  .primary-btn{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:10px;
    border-radius:6px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .primary-btn:hover{background:var(--navy-dark)}
  .error-msg{
    background:var(--danger-bg);
    color:var(--danger);
    padding:9px 11px;
    border-radius:6px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }

  main{
    max-width:880px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  .type-section{margin-bottom:34px}
  .type-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .type-header h2{
    font-size:15px;
    font-weight:600;
    color:var(--navy);
    margin:0;
    text-transform:uppercase;
    letter-spacing:.4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    user-select:none;
  }
  .type-header h2 .type-chev{
    transition:transform .15s ease;
    font-size:12px;
  }
  .type-section.collapsed .type-chev{transform:rotate(-90deg)}
  .type-section.collapsed .type-body{display:none}
  .add-role-btn{
    background:#fff;
    border:1px solid var(--navy);
    color:var(--navy);
    font-size:13px;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .add-role-btn:hover{background:#eaf1f8}

  .role-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .role-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 16px;
    cursor:pointer;
  }
  .role-summary .titles{min-width:0}
  .role-summary .title{font-weight:600;font-size:14.5px}
  .role-summary .org{font-size:13px;color:var(--muted)}
  .role-summary .dates{
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    margin-left:14px;
  }
  .chev{
    transition:transform .15s ease;
    color:var(--muted);
    flex-shrink:0;
    margin-left:10px;
  }
  .role-card.open .chev{transform:rotate(90deg)}
  .role-body{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid var(--line);
  }
  .role-card.open .role-body{display:block}
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 14px;
    padding-top:14px;
  }
  .field-row.full{grid-template-columns:1fr}
  .bullets-label{
    font-size:13px;
    font-weight:500;
    margin:6px 0 8px;
    color:var(--ink);
  }
  .bullet-row{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .bullet-row textarea{flex:1;margin-bottom:0}
  .icon-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    width:32px;
    height:32px;
    flex-shrink:0;
    cursor:pointer;
    color:var(--muted);
    font-size:15px;
    line-height:1;
  }
  .icon-btn:hover{border-color:var(--danger);color:var(--danger)}
  .add-bullet-btn{
    background:none;
    border:1px dashed var(--line);
    color:var(--muted);
    font-size:13px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    margin-top:2px;
  }
  .add-bullet-btn:hover{border-color:var(--navy);color:var(--navy)}
  .tags-input{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    border:1px solid var(--line);border-radius:6px;padding:7px 8px;
    background:#fff;
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    background:#eaf1f8;color:var(--navy-dark);
    border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;
    white-space:nowrap;
  }
  .tag button{
    background:none;border:none;color:var(--navy-dark);
    cursor:pointer;font-size:11px;line-height:1;padding:2px;
  }
  .tags-input input{
    border:none;outline:none;flex:1;min-width:140px;
    font-size:14px;font-family:inherit;padding:4px 2px;background:transparent;
  }

  .row-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .save-btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  .save-btn:hover{background:var(--navy-dark)}
  .delete-role-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:13px;
    cursor:pointer;
  }
  .save-status{
    font-size:12.5px;
    color:var(--ok);
    margin-left:12px;
    opacity:0;
    transition:opacity .2s;
  }
  .save-status.show{opacity:1}

  .empty-state{
    font-size:13.5px;
    color:var(--muted);
    padding:14px 0;
  }
  #toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  #toast.show{opacity:1}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>CV data admin</h1>
    <p class="sub">Sign in to edit Andrew's CV data</p>
    <div class="error-msg" id="login-error"></div>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <button class="primary-btn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>CV data admin</h1>
    <div class="who">
      <span id="who-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </header>
  <main>
    <section class="type-section" id="profile-section" style="margin-bottom:34px">
      <div class="type-header">
        <h2><span class="type-chev">▾</span>Profile</h2>
      </div>
      <div class="type-body">
        <div class="role-card open" style="cursor:default">
          <div class="role-body" style="display:block;border-top:none;padding-top:14px">
            <div class="field-row full">
              <div>
                <label>Personal Summary</label>
                <textarea id="profile-summary" rows="3"></textarea>
              </div>
            </div>
            <div class="field-row full">
              <div>
                <label>Leadership Style</label>
                <textarea id="profile-leadership-style" rows="3"></textarea>
              </div>
            </div>
            <div class="field-row full">
              <div>
                <div class="bullets-label" style="margin-top:0">Hobbies</div>
                <div class="tags-input" id="hobbies-input">
                  <input type="text" id="hobby-entry" placeholder="Type a hobby, press Enter">
                </div>
              </div>
            </div>
            <div class="field-row">
              <div>
                <label>Email</label>
                <div style="display:flex;gap:8px;align-items:center">
                  <input type="text" id="profile-email" style="margin-bottom:0">
                  <a id="profile-email-link" href="#" target="_blank" class="icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" title="Open">↗</a>
                </div>
              </div>
              <div>
                <label>Phone</label>
                <div style="display:flex;gap:8px;align-items:center">
                  <input type="text" id="profile-phone" style="margin-bottom:0">
                  <a id="profile-phone-link" href="#" target="_blank" class="icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" title="Open">↗</a>
                </div>
              </div>
              <div>
                <label>Website</label>
                <div style="display:flex;gap:8px;align-items:center">
                  <input type="text" id="profile-website" style="margin-bottom:0">
                  <a id="profile-website-link" href="#" target="_blank" class="icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" title="Open">↗</a>
                </div>
              </div>
              <div>
                <label>LinkedIn</label>
                <div style="display:flex;gap:8px;align-items:center">
                  <input type="text" id="profile-linkedin" style="margin-bottom:0">
                  <a id="profile-linkedin-link" href="#" target="_blank" class="icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" title="Open">↗</a>
                </div>
              </div>
              <div>
                <label>Location</label>
                <input type="text" id="profile-location">
              </div>
            </div>
            <div class="row-actions" style="justify-content:flex-start">
              <button class="save-btn" id="profile-save-btn">Save changes</button>
              <span class="save-status" id="profile-save-status">Saved</span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="sections"></div>
  </main>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://vbtgxnrnuvxhwyktjviz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZidGd4bnJudXZ4aHd5a3Rqdml6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjI4NDcsImV4cCI6MjEwNjE5ODg0N30.-w5Zo5uFr0ke64lojjIS2xrvga46ggwiDiRCQNZKqdI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById("login-screen");
const app = document.getElementById("app");
const sectionsEl = document.getElementById("sections");
const whoEmailEl = document.getElementById("who-email");

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

// ---- Auto-growing textareas ----
function autoGrow(el){
  if (!el || el.tagName !== "TEXTAREA") return;
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
}
function autoGrowAll(root){
  (root || document).querySelectorAll("textarea").forEach(autoGrow);
}
// Grows as the user types in any textarea, present or future
document.addEventListener("input", (e)=>{
  if (e.target && e.target.tagName === "TEXTAREA") autoGrow(e.target);
});
// Catch textareas whose value is set programmatically (loadProfile, role/bullet rendering)
new MutationObserver((mutations)=>{
  for (const m of mutations){
    m.addedNodes.forEach(node=>{
      if (node.nodeType !== 1) return;
      if (node.tagName === "TEXTAREA") autoGrow(node);
      else if (node.querySelectorAll) node.querySelectorAll("textarea").forEach(autoGrow);
    });
  }
}).observe(document.body, { childList:true, subtree:true });

// ---- Auth ----
document.getElementById("login-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){
    errEl.textContent = "Couldn't sign in: " + error.message;
    errEl.style.display = "block";
    return;
  }
  await boot();
});

document.getElementById("signout-btn").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  location.reload();
});

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session){
    await boot();
  }
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  loginScreen.style.display = "none";
  app.style.display = "block";
  whoEmailEl.textContent = session.user.email;
  await loadProfile();
  await loadAll();
}

// ---- Data loading ----
let TYPES = [];
let ROLES = [];
let BULLETS = [];

async function loadAll(){
  const [{ data: types, error: e1 }, { data: roles, error: e2 }, { data: bullets, error: e3 }] = await Promise.all([
    sb.from("cv_types").select("*").order("sort_order"),
    sb.from("cv_roles").select("*"),
    sb.from("cv_bullets").select("*").order("sort_order"),
  ]);
  if (e1 || e2 || e3){
    toast("Couldn't load data: " + (e1||e2||e3).message);
    return;
  }
  TYPES = types;
  ROLES = roles;
  BULLETS = bullets;
  render();
}

function bulletsForRole(roleId){
  return BULLETS.filter(b=>b.role_id===roleId).sort((a,b)=>a.sort_order-b.sort_order);
}

function fmtDate(d){
  if(!d) return null;
  const [y,m] = d.split("-");
  return new Date(Number(y), Number(m)-1).toLocaleDateString("en-NZ",{month:"short",year:"numeric"});
}

// Work and Education are ranges (blank end = ongoing); Certificate and Award are a single achieved-on date.
const RANGE_TYPES = new Set(["Work","Education"]);

function dateLabel(role, typeName){
  const start = fmtDate(role.start_date);
  if (RANGE_TYPES.has(typeName)){
    const end = fmtDate(role.end_date) || "Present";
    return `${start||"?"} \u2013 ${end}`;
  }
  return start || "";
}

// ---- Render ----
function render(){
  sectionsEl.innerHTML = "";
  TYPES.forEach(type=>{
    const rolesOfType = ROLES.filter(r=>r.type_id===type.id).sort((a,b)=>b.sort_order-a.sort_order);

    const section = document.createElement("section");
    section.className = "type-section collapsed";

    const header = document.createElement("div");
    header.className = "type-header";
    header.innerHTML = `<h2><span class="type-chev">\u25BE</span>${escapeHtml(type.name)}</h2>`;
    header.querySelector("h2").onclick = ()=>{
      section.classList.toggle("collapsed");
      if (!section.classList.contains("collapsed")) autoGrowAll(section);
    };
    const addBtn = document.createElement("button");
    addBtn.className = "add-role-btn";
    addBtn.textContent = "+ Add entry";
    addBtn.onclick = (e)=>{ e.stopPropagation(); addNewRole(type.id); };
    header.appendChild(addBtn);
    section.appendChild(header);

    const body = document.createElement("div");
    body.className = "type-body";

    if (rolesOfType.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No entries yet.";
      body.appendChild(empty);
    }

    rolesOfType.forEach(role=>{
      body.appendChild(renderRoleCard(role, type.name));
    });

    section.appendChild(body);
    sectionsEl.appendChild(section);
  });
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderRoleCard(role, typeName){
  const isRange = RANGE_TYPES.has(typeName);
  const card = document.createElement("div");
  card.className = "role-card";
  card.dataset.roleId = role.id;

  const summary = document.createElement("div");
  summary.className = "role-summary";
  summary.innerHTML = `
    <div class="titles">
      <div class="title">${escapeHtml(role.title)||"(untitled)"}</div>
      <div class="org">${escapeHtml(role.org)||""}</div>
    </div>
    <div class="dates">${dateLabel(role, typeName)}</div>
    <div class="chev">\u25B8</div>
  `;
  summary.onclick = ()=> card.classList.toggle("open");
  card.appendChild(summary);

  const body = document.createElement("div");
  body.className = "role-body";

  const row1 = document.createElement("div");
  row1.className = "field-row";
  row1.innerHTML = `
    <div>
      <label>Title</label>
      <input type="text" data-field="title" value="${escapeHtml(role.title)}">
    </div>
    <div>
      <label>Organisation</label>
      <input type="text" data-field="org" value="${escapeHtml(role.org)}">
    </div>
    <div>
      <label>${isRange ? "Start date" : "Date"}</label>
      <input type="date" data-field="start_date" value="${role.start_date||""}">
    </div>
    ${isRange ? `
    <div>
      <label>End date (blank = present)</label>
      <input type="date" data-field="end_date" value="${role.end_date||""}">
    </div>` : ""}
    <div>
      <label>Location</label>
      <input type="text" data-field="location" value="${escapeHtml(role.location)}">
    </div>
    <div>
      <label>Sort order (higher = earlier in list)</label>
      <input type="text" data-field="sort_order" value="${role.sort_order}">
    </div>
  `;
  body.appendChild(row1);

  const row2 = document.createElement("div");
  row2.className = "field-row full";
  row2.innerHTML = `
    <div>
      <label>Summary</label>
      <textarea data-field="summary" rows="2">${escapeHtml(role.summary)}</textarea>
    </div>
  `;
  body.appendChild(row2);

  const bulletsLabel = document.createElement("div");
  bulletsLabel.className = "bullets-label";
  bulletsLabel.textContent = "Bullets";
  body.appendChild(bulletsLabel);

  const bulletsWrap = document.createElement("div");
  bulletsWrap.className = "bullets-wrap";
  bulletsForRole(role.id).forEach(b=>{
    bulletsWrap.appendChild(renderBulletRow(b));
  });
  body.appendChild(bulletsWrap);

  const addBulletBtn = document.createElement("button");
  addBulletBtn.className = "add-bullet-btn";
  addBulletBtn.textContent = "+ Add bullet";
  addBulletBtn.onclick = ()=>{
    const row = renderBulletRow({ id: null, bullet_text: "", sort_order: bulletsWrap.children.length + 1, role_id: role.id });
    bulletsWrap.appendChild(row);
    row.querySelector("textarea").focus();
  };
  body.appendChild(addBulletBtn);

  const actions = document.createElement("div");
  actions.className = "row-actions";
  actions.innerHTML = `
    <div>
      <button class="save-btn">Save changes</button>
      <span class="save-status">Saved</span>
    </div>
    <button class="delete-role-btn">Delete this entry</button>
  `;
  actions.querySelector(".save-btn").onclick = (e)=>{ e.stopPropagation(); saveRole(card, role); };
  actions.querySelector(".delete-role-btn").onclick = (e)=>{ e.stopPropagation(); deleteRole(role); };
  body.appendChild(actions);

  card.appendChild(body);
  return card;
}

function renderBulletRow(bullet){
  const row = document.createElement("div");
  row.className = "bullet-row";
  row.dataset.bulletId = bullet.id || "";
  row.innerHTML = `
    <textarea rows="2">${escapeHtml(bullet.bullet_text)}</textarea>
    <button class="icon-btn" title="Remove bullet">\u2715</button>
  `;
  row.querySelector(".icon-btn").onclick = ()=> row.remove();
  return row;
}

function addNewRole(typeId){
  const tempRole = {
    id: null,
    type_id: typeId,
    org: "",
    title: "New entry",
    start_date: null,
    end_date: null,
    location: "",
    summary: "",
    sort_order: 0
  };
  ROLES.push(tempRole);
  render();
  const card = sectionsEl.querySelector(`.role-card[data-role-id=""]`) ||
    Array.from(sectionsEl.querySelectorAll(".role-card")).find(c=>!c.dataset.roleId);
  if (card) card.classList.add("open");
}

// ---- Save / delete ----
async function saveRole(card, role){
  const body = card.querySelector(".role-body");
  const get = f => { const el = body.querySelector(`[data-field="${f}"]`); return el ? el.value : ""; };

  const payload = {
    type_id: role.type_id,
    title: get("title"),
    org: get("org"),
    start_date: get("start_date") || null,
    end_date: get("end_date") || null,
    location: get("location"),
    summary: get("summary"),
    sort_order: parseInt(get("sort_order"),10) || 0,
  };

  let roleId = role.id;
  if (!roleId){
    const { data, error } = await sb.from("cv_roles").insert(payload).select().single();
    if (error){ toast("Couldn't save entry: " + error.message); return; }
    roleId = data.id;
  } else {
    const { error } = await sb.from("cv_roles").update(payload).eq("id", roleId);
    if (error){ toast("Couldn't save entry: " + error.message); return; }
  }

  const bulletRows = Array.from(body.querySelectorAll(".bullet-row"));
  const keepIds = [];
  for (let i=0; i<bulletRows.length; i++){
    const r = bulletRows[i];
    const text = r.querySelector("textarea").value.trim();
    if (!text) continue;
    if (r.dataset.bulletId){
      await sb.from("cv_bullets").update({ bullet_text: text, sort_order: i+1 }).eq("id", r.dataset.bulletId);
      keepIds.push(r.dataset.bulletId);
    } else {
      const { data } = await sb.from("cv_bullets").insert({ role_id: roleId, bullet_text: text, sort_order: i+1 }).select().single();
      if (data) keepIds.push(data.id);
    }
  }
  const existingIds = bulletsForRole(role.id).map(b=>String(b.id));
  const toDelete = existingIds.filter(id=>!keepIds.includes(id));
  for (const id of toDelete){
    await sb.from("cv_bullets").delete().eq("id", id);
  }

  const status = card.querySelector(".save-status");
  status.classList.add("show");
  setTimeout(()=>status.classList.remove("show"), 1500);

  await loadAll();
  const reopened = sectionsEl.querySelector(`.role-card[data-role-id="${roleId}"]`);
  if (reopened) reopened.classList.add("open");
}

async function deleteRole(role){
  if (!confirm(`Delete "${role.title}" at ${role.org}? This can't be undone.`)) return;
  if (role.id){
    const { error } = await sb.from("cv_roles").delete().eq("id", role.id);
    if (error){ toast("Couldn't delete: " + error.message); return; }
  }
  await loadAll();
}

document.querySelector('#profile-section .type-header h2').onclick = ()=>{
  const sec = document.getElementById('profile-section');
  sec.classList.toggle('collapsed');
  if (!sec.classList.contains('collapsed')) autoGrowAll(sec);
};

function linkHrefFor(kind, value){
  value = (value||"").trim();
  if (!value) return "#";
  if (kind === "email") return "mailto:" + value;
  if (kind === "phone") return "tel:" + value.replace(/[^\d+]/g,"");
  if (kind === "website" || kind === "linkedin"){
    return /^https?:\/\//i.test(value) ? value : "https://" + value;
  }
  return "#";
}

["email","phone","website","linkedin"].forEach(kind=>{
  const input = document.getElementById("profile-" + kind);
  const link = document.getElementById("profile-" + kind + "-link");
  input.addEventListener("input", ()=>{ link.href = linkHrefFor(kind, input.value); });
});

function addHobbyTag(text){
  text = (text||"").trim();
  if (!text) return;
  const wrap = document.getElementById("hobbies-input");
  const entry = document.getElementById("hobby-entry");
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.dataset.text = text;
  tag.textContent = text;
  const rm = document.createElement("button");
  rm.type = "button";
  rm.textContent = "\u2715";
  rm.title = "Remove";
  rm.onclick = ()=> tag.remove();
  tag.appendChild(rm);
  wrap.insertBefore(tag, entry);
}

function clearHobbyTags(){
  document.querySelectorAll("#hobbies-input .tag").forEach(t=>t.remove());
}

const hobbyEntry = document.getElementById("hobby-entry");
hobbyEntry.addEventListener("keydown", (e)=>{
  if (e.key === "Enter" || e.key === ","){
    e.preventDefault();
    addHobbyTag(hobbyEntry.value);
    hobbyEntry.value = "";
  } else if (e.key === "Backspace" && hobbyEntry.value === ""){
    const tags = document.querySelectorAll("#hobbies-input .tag");
    if (tags.length) tags[tags.length-1].remove();
  }
});
hobbyEntry.addEventListener("blur", ()=>{
  addHobbyTag(hobbyEntry.value);
  hobbyEntry.value = "";
});

async function loadProfile(){
  const { data, error } = await sb.from("cv_profile").select("*").eq("id",1).single();
  if (error){ toast("Couldn't load profile: " + error.message); return; }
  document.getElementById("profile-summary").value = data.summary || "";
  document.getElementById("profile-leadership-style").value = data.leadership_style || "";
  autoGrow(document.getElementById("profile-summary"));
  autoGrow(document.getElementById("profile-leadership-style"));
  ["email","phone","website","linkedin","location"].forEach(f=>{
    document.getElementById("profile-"+f).value = data[f] || "";
  });
  ["email","phone","website","linkedin"].forEach(kind=>{
    const input = document.getElementById("profile-" + kind);
    document.getElementById("profile-" + kind + "-link").href = linkHrefFor(kind, input.value);
  });

  const { data: hobbies, error: hErr } = await sb.from("cv_hobbies").select("*").order("sort_order");
  if (hErr){ toast("Couldn't load hobbies: " + hErr.message); return; }
  clearHobbyTags();
  hobbies.forEach(h=> addHobbyTag(h.hobby_text));
}

document.getElementById("profile-save-btn").addEventListener("click", async ()=>{
  const payload = {
    summary: document.getElementById("profile-summary").value,
    leadership_style: document.getElementById("profile-leadership-style").value,
    email: document.getElementById("profile-email").value,
    phone: document.getElementById("profile-phone").value,
    website: document.getElementById("profile-website").value,
    linkedin: document.getElementById("profile-linkedin").value,
    location: document.getElementById("profile-location").value,
  };
  const { error } = await sb.from("cv_profile").update(payload).eq("id",1);
  if (error){ toast("Couldn't save profile: " + error.message); return; }

  const hobbyTexts = Array.from(document.querySelectorAll("#hobbies-input .tag")).map(t=>t.dataset.text);
  await sb.from("cv_hobbies").delete().neq("id", "00000000-0000-0000-0000-000000000000");
  if (hobbyTexts.length){
    await sb.from("cv_hobbies").insert(hobbyTexts.map((text, i)=>({ hobby_text: text, sort_order: i+1 })));
  }

  const status = document.getElementById("profile-save-status");
  status.classList.add("show");
  setTimeout(()=>status.classList.remove("show"), 1500);
  await loadProfile();
});

checkSession();
</script>
